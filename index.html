<!DOCTYPE html>
<html>
<head>
    <title>Task 3</title>

    <style>
        .page {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: auto 1fr auto;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
        }

        header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            width: 80px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        aside {
            grid-area: sidebar;
        }

        main {
            grid-area: main;
        }

        footer {
            grid-area: footer;
        }

        .cards {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .card {
            flex: 1;
            border: 1px solid black;
            padding: 10px;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card:hover {
            box-shadow: 0 4px 8px gray;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 250px);
            grid-template-rows: repeat(3, 250px);
            gap: 10px;
        }

        .gallery-item {
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .caption {
            position: absolute;
            bottom: 0;
            background: black;
            color: white;
            width: 100%;
            text-align: center;
            opacity: 0;
        }

        .gallery-item:hover .caption {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="page">

        <header>

            <div class="logo">
                <img src="https://i.pinimg.com/736x/05/e9/54/05e954146fa94336be5615b43af92102.jpg">
            </div>

            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
                <a href="portfolio.html">Portfolio</a>
            </nav>

        </header>


        <aside>
            <h2>Sidebar</h2>
            <p>This is the sidebar.</p>
        </aside>


        <main>

            <div class="cards">

                <div class="card">
                    <img src="https://i.pinimg.com/736x/ef/9f/c9/ef9fc99a85815074a47ffba55f1127e5.jpg">
                    <h2>Card 1</h2>
                    <p>This is the first card.</p>
                    <button>Read More</button>
                </div>

                <div class="card">
                    <img src="https://i.pinimg.com/736x/cb/c3/3f/cbc33fe73cf6590367bfad96400f41f3.jpg">
                    <h2>Card 2</h2>
                    <p>This is the second card.</p>
                    <button>Read More</button>
                </div>

                <div class="card">
                    <img src="https://i.pinimg.com/1200x/9f/a4/d0/9fa4d07c5052fa177cd17b036c93498d.jpg">
                    <h2>Card 3</h2>
                    <p>This is the third card.</p>
                    <button>Read More</button>
                </div>

            </div>


            <div class="gallery">

                <div class="gallery-item">
                    <img src="https://i.pinimg.com/736x/e6/ba/f8/e6baf843d9f90eb86636609e8984bb99.jpg">
                    <div class="caption">Image 1</div>
                </div>

                <div class="gallery-item">
                    <img src="https://i.pinimg.com/736x/1b/35/49/1b354956bd8f7f8e3974104ec472fee5.jpg">
                    <div class="caption">Image 2</div>
                </div>

                <div class="gallery-item">
                    <img src="https://i.pinimg.com/736x/c3/4a/b9/c34ab9fea498395897c9beabae821880.jpg">
                    <div class="caption">Image 3</div>
                </div>

                <div class="gallery-item">
                    <img src="https://i.pinimg.com/736x/61/8f/43/618f43643ebc11d84d349d78c25ecaef.jpg">
                    <div class="caption">Image 4</div>
                </div>

                <div class="gallery-item">
                    <img src="https://i.pinimg.com/736x/da/70/92/da7092722debc85abbb710f1333d633e.jpg">
                    <div class="caption">Image 5</div>
                </div>

                <div class="gallery-item">
                    <img src="https://i.pinimg.com/736x/51/2a/b0/512ab0e4cc8524d55ea0c31d2814d15a.jpg">
                    <div class="caption">Image 6</div>
                </div>

                <div class="gallery-item">

                </div>

                <div class="gallery-item">

                </div>

                <div class="gallery-item">
                    <img src="https://i.pinimg.com/736x/93/f7/a3/93f7a3cbd0bf2a8cee20eb2a3d677830.jpg">
                    <div class="caption">Image 9</div>
                </div>

            </div>

        </main>


        <footer>
            <p>Footer</p>
        </footer>

    </div>

</body>
</html>
